    post:
      description: Answers `409 balance_mismatch` when the statement disagrees with its own control totals (repeat with `force=true` to accept), and `409 already_imported` for a file imported before.
      operationId: commit-import
      parameters:
        - description: Write the import even though its control totals do not match (F-IMP-3).
          explode: false
          in: query
          name: force
          schema:
            description: Write the import even though its control totals do not match (F-IMP-3).
            type: boolean
      requestBody:
        content:
          multipart/form-data:
            encoding:
              file:
                contentType: text/csv,text/plain,application/octet-stream
              layout:
                contentType: text/plain
              mapping:
                contentType: text/plain
              template_name:
                contentType: text/plain
            schema:
              properties:
                file:
                  contentEncoding: binary
                  contentMediaType: application/octet-stream
                  format: binary
                  type: string
                layout:
                  description: "JSON ColumnLayout from the mapper: read the file as a CSV with these columns instead of detecting its format."
                  type: string
                mapping:
                  description: Where each statement account goes, keyed by accounts[].key from the preview; omitted keys take the suggestion.
                  type: string
                template_name:
                  description: "Commit only: keep the layout as a template under this name, so the next file of the same shape is read by it."
                  type: string
              required:
                - file
              type: object
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
          description: Created
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Request Entity Too Large
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - bearerAuth: []
      summary: Import a statement atomically
      tags:
        - Imports
