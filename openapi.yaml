components:
  schemas:
    Account:
      additionalProperties: false
      properties:
        account_number:
          type: string
        archived:
          type: boolean
        balance:
          $ref: "#/components/schemas/Amount"
          description: Opening balance plus every imported movement.
        bank_id:
          description: Bank register id, see GET /banks.
          type: string
        color_key:
          type: string
        currency:
          type: string
        id:
          type: string
        institution:
          enum:
            - mbank_cz
            - mbank_sk
            - revolut
            - ibkr
            - fingood
            - investown
            - portu
            - other
          type: string
        kind:
          enum:
            - current
            - savings
            - pocket
            - fund
            - broker
            - cash
            - card
            - p2p
            - pension
            - property
            - other_asset
            - mortgage
            - loan
            - loan_reserve
          type: string
        last_booked_on:
          format: date
          type: string
        name:
          type: string
        opening_balance:
          $ref: "#/components/schemas/Amount"
        parent_id:
          description: "The account this one belongs to: a pocket's main account, a loan reserve's mortgage."
          type: string
        transaction_count:
          format: int64
          type: integer
      required:
        - id
        - name
        - institution
        - kind
        - currency
        - opening_balance
        - balance
        - transaction_count
        - archived
      type: object
    AccountFlow:
      additionalProperties: false
      properties:
        account_id:
          type: string
        amount_minor:
          description: "Positive: put aside; negative: taken back."
          format: int64
          type: integer
      required:
        - account_id
        - amount_minor
      type: object
    AccountPerformance:
      additionalProperties: false
      properties:
        annual_return:
          description: Money-weighted annual return (XIRR) as a decimal fraction, 0.085 = 8.5 %; absent when it cannot be told.
          type: string
        contributed:
          $ref: "#/components/schemas/Amount"
        flows:
          description: Transfers between this account and other own accounts, oldest first.
          items:
            $ref: "#/components/schemas/TransferFlow"
          type: array
        gain:
          $ref: "#/components/schemas/Amount"
          description: Value less the money put in net of what was taken out.
        value:
          $ref: "#/components/schemas/Amount"
          description: The latest value; absent before the first.
        valued_on:
          format: date
          type: string
        withdrawn:
          $ref: "#/components/schemas/Amount"
      required:
        - contributed
        - withdrawn
        - flows
      type: object
    AccountValuation:
      additionalProperties: false
      properties:
        id:
          type: string
        note:
          type: string
        value:
          $ref: "#/components/schemas/Amount"
          description: "For a loan: the balance owed, positive."
        valued_on:
          format: date
          type: string
      required:
        - id
        - valued_on
        - value
        - note
      type: object
    AccountValue:
      additionalProperties: false
      properties:
        account_id:
          type: string
        class:
          enum:
            - cash
            - savings
            - investments
            - p2p
            - pension
            - property
            - other
            - mortgage
            - loan
          type: string
        liquidity:
          description: How soon the money could be spent; absent for a liability.
          enum:
            - immediate
            - days
            - locked
          type: string
        unvalued:
          description: An asset never valued, or a loan without terms or a balance; it counts as zero.
          type: boolean
        valuation:
          description: "ledger: balance from transactions; market: plus positions at market prices; snapshot: values entered by hand or imported; schedule: the loan's repayment schedule; flows: a loan reserve, transfers in less out from a statement balance."
          enum:
            - ledger
            - market
            - snapshot
            - schedule
            - flows
          type: string
        value:
          $ref: "#/components/schemas/Amount"
          description: In the account's currency, negative for a liability; a broker account's positions count only in value_czk.
        value_czk:
          $ref: "#/components/schemas/Amount"
          description: Absent without an exchange rate.
        valued_on:
          description: The day of the value a snapshot account carries.
          format: date
          type: string
      required:
        - account_id
        - class
        - valuation
        - value
        - unvalued
      type: object
    AgentToken:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        expires_at:
          format: date-time
          type: string
        id:
          type: string
        last4:
          type: string
        last_used_at:
          format: date-time
          type: string
        name:
          type: string
        revoked_at:
          format: date-time
          type: string
        scopes:
          items:
            type: string
          type: array
      required:
        - id
        - name
        - last4
        - scopes
        - created_at
      type: object
    Alias:
      additionalProperties: false
      properties:
        account_id:
          type: string
        created_at:
          format: date-time
          type: string
        id:
          type: string
        identity:
          description: The bank account number or importer reference that is mapped.
          type: string
        institution:
          type: string
      required:
        - id
        - institution
        - identity
        - account_id
        - created_at
      type: object
    AmbiguousTransfer:
      additionalProperties: false
      properties:
        candidate_ids:
          description: Incoming movements that could be its other leg.
          items:
            type: string
          type: array
        number_matches:
          description: "Candidates whose account number one leg names as its counterparty account: the likelier ones."
          items:
            type: string
          type: array
        transaction_id:
          description: The outgoing leg.
          type: string
      required:
        - transaction_id
        - candidate_ids
        - number_matches
      type: object
    Amount:
      additionalProperties: false
      properties:
        currency:
          description: ISO 4217 code.
          maxLength: 3
          minLength: 3
          type: string
        minor:
          description: Amount in the currency's smallest unit (haléře, cents).
          format: int64
          type: integer
      required:
        - minor
        - currency
      type: object
    Assignment:
      additionalProperties: false
      properties:
        amount_minor:
          format: int64
          type: integer
        category_id:
          type: string
        source:
          description: "model: the learned classifier chose it; confirm or change it. loan: a loan instalment split by its schedule."
          enum:
            - rule
            - manual
            - bank
            - model
            - loan
          type: string
      required:
        - category_id
        - amount_minor
        - source
      type: object
    AuditEntry:
      additionalProperties: false
      properties:
        id:
          format: int64
          type: integer
        occurred_at:
          format: date-time
          type: string
        operation:
          type: string
        result_count:
          format: int64
          type: integer
        status:
          format: int64
          type: integer
        token_id:
          type: string
        token_name:
          type: string
      required:
        - id
        - token_id
        - token_name
        - operation
        - status
        - occurred_at
      type: object
    Bank:
      additionalProperties: false
      properties:
        bic:
          type: string
        code:
          description: "Domestic bank code (CZ: after the slash, SK: in the IBAN)."
          type: string
        country:
          type: string
        id:
          examples:
            - cz-0800
          type: string
        name:
          type: string
        short_name:
          type: string
      required:
        - id
        - name
        - short_name
      type: object
    BudgetGroup:
      additionalProperties: false
      properties:
        code:
          type: string
        id:
          type: string
        name_cs:
          type: string
        name_en:
          type: string
        name_sk:
          type: string
        sort:
          format: int64
          type: integer
      required:
        - id
        - code
        - name_cs
        - name_sk
        - name_en
        - sort
      type: object
    BudgetLine:
      additionalProperties: false
      properties:
        budget_group_id:
          type: string
        category_id:
          type: string
        planned_minor:
          format: int64
          type: integer
        projected_minor:
          description: Spending by month end at the current pace.
          format: int64
          type: integer
        remaining_minor:
          format: int64
          type: integer
        spent_minor:
          format: int64
          type: integer
        status:
          enum:
            - on_track
            - ahead_of_pace
            - over
          type: string
      required:
        - planned_minor
        - spent_minor
        - remaining_minor
        - projected_minor
        - status
      type: object
    BudgetLineInput:
      additionalProperties: false
      properties:
        budget_group_id:
          type: string
        category_id:
          type: string
        planned_minor:
          format: int64
          minimum: 0
          type: integer
      required:
        - planned_minor
      type: object
    BudgetMonth:
      additionalProperties: false
      properties:
        currency:
          type: string
        days_left:
          description: Including today.
          format: int64
          type: integer
        elapsed:
          description: Share of the month gone, 0–1; where the pace marker sits.
          format: double
          type: number
        lines:
          items:
            $ref: "#/components/schemas/BudgetLine"
          type: array
        month:
          examples:
            - 2026-10
          type: string
        per_day_minor:
          format: int64
          type: integer
        planned_minor:
          format: int64
          type: integer
        remaining_minor:
          description: What is left to spend this month (F-VYU-3).
          format: int64
          type: integer
        spent_minor:
          format: int64
          type: integer
        unbudgeted:
          description: Main categories with spending but no budget line.
          items:
            $ref: "#/components/schemas/UnbudgetedCategory"
          type: array
      required:
        - month
        - currency
        - lines
        - unbudgeted
        - planned_minor
        - spent_minor
        - remaining_minor
        - elapsed
        - days_left
        - per_day_minor
      type: object
    Candle:
      additionalProperties: false
      properties:
        close:
          type: string
        day:
          format: date
          type: string
        high:
          type: string
        low:
          type: string
        open:
          type: string
        volume:
          format: int64
          type: integer
      required:
        - day
        - close
      type: object
    CandlesOutputBody:
      additionalProperties: false
      properties:
        candles:
          description: Daily, oldest first.
          items:
            $ref: "#/components/schemas/Candle"
          type: array
        currency:
          description: The quote's currency.
          type: string
        symbol:
          description: "Absent: the instrument has no Yahoo symbol, so no candles."
          type: string
      required:
        - currency
        - candles
      type: object
    CategoriesReport:
      additionalProperties: false
      properties:
        currency:
          type: string
        months:
          description: Oldest first.
          items:
            $ref: "#/components/schemas/CategoryMonth"
          type: array
      required:
        - currency
        - months
      type: object
    CategorizeInputBody:
      additionalProperties: false
      properties:
        lines:
          description: One line, or several for a split; they must add up to the amount.
          items:
            $ref: "#/components/schemas/CategoryLine"
          maxItems: 20
          minItems: 1
          type: array
        save_rule:
          description: Turn a single-line choice into a rule matching on this field.
          enum:
            - counterparty
            - description
            - counterparty_account
          type: string
      required:
        - lines
      type: object
    CategorizeOutputBody:
      additionalProperties: false
      properties:
        applied_to_other:
          description: Other transactions the new rule categorised.
          format: int64
          type: integer
        rule_id:
          type: string
        suggested_rule:
          $ref: "#/components/schemas/SuggestedRule"
          description: Offered when the same choice for this counterparty keeps repeating.
        transaction:
          $ref: "#/components/schemas/Transaction"
      required:
        - transaction
        - applied_to_other
      type: object
    Category:
      additionalProperties: false
      properties:
        budget_group_id:
          type: string
        code:
          type: string
        color_key:
          description: Theme token key; absent on a subcategory, which uses its parent's.
          type: string
        custom:
          description: The user's own category. A system category only takes the user's colour, icon and group.
          type: boolean
        icon:
          type: string
        id:
          type: string
        kind:
          enum:
            - income
            - expense
            - financial
            - transfer
          type: string
        name_cs:
          type: string
        name_en:
          type: string
        name_sk:
          type: string
        parent_id:
          type: string
        sort:
          format: int64
          type: integer
        usage:
          $ref: "#/components/schemas/Usage"
          description: Present in the taxonomy listing.
      required:
        - id
        - code
        - name_cs
        - name_sk
        - name_en
        - kind
        - sort
        - custom
      type: object
    CategoryLine:
      additionalProperties: false
      properties:
        amount_minor:
          format: int64
          type: integer
        category_id:
          type: string
      required:
        - category_id
        - amount_minor
      type: object
    CategoryMonth:
      additionalProperties: false
      properties:
        expenses:
          description: Per main category, largest first; empty for a month without spending.
          items:
            $ref: "#/components/schemas/CategoryTotal"
          type: array
        month:
          type: string
      required:
        - month
        - expenses
      type: object
    CategoryTotal:
      additionalProperties: false
      properties:
        amount_minor:
          format: int64
          type: integer
        category_id:
          description: Absent for the not-yet-categorised share.
          type: string
      required:
        - amount_minor
      type: object
    ColumnLayout:
      additionalProperties: false
      properties:
        columns:
          additionalProperties:
            format: int64
            type: integer
          description: "Field to 0-based column. Fields: date, amount, credit, debit, currency, description, counterparty, counterparty_account, bank_code, message, vs, ks, ss, balance_after, id."
          type: object
        currency:
          description: The currency of every row when no column holds one.
          type: string
        date_order:
          enum:
            - dmy
            - mdy
            - ymd
          type: string
        delimiter:
          maxLength: 1
          minLength: 1
          type: string
        encoding:
          enum:
            - utf-8
            - windows-1250
          type: string
        header_row:
          description: 0-based row with the column names; data follows it.
          format: int64
          minimum: 0
          type: integer
      required:
        - encoding
        - delimiter
        - header_row
        - columns
        - date_order
      type: object
    ConfirmOutputBody:
      additionalProperties: false
      properties:
        confirmed:
          format: int64
          type: integer
      required:
        - confirmed
      type: object
    CopyBudgetOutputBody:
      additionalProperties: false
      properties:
        copied:
          format: int64
          type: integer
      required:
        - copied
      type: object
    CreateAgentTokenInputBody:
      additionalProperties: false
      properties:
        expires_in_days:
          description: Omit for a token that does not expire.
          format: int64
          maximum: 365
          minimum: 1
          type: integer
        name:
          maxLength: 80
          minLength: 1
          type: string
        scopes:
          items:
            enum:
              - accounts:read
              - transactions:read
              - categories:read
              - budgets:read
              - reports:read
              - investments:read
            type: string
          minItems: 1
          type: array
      required:
        - name
        - scopes
      type: object
    CreateAgentTokenOutputBody:
      additionalProperties: false
      properties:
        secret:
          description: The token itself. Shown only in this response.
          type: string
        token:
          $ref: "#/components/schemas/AgentToken"
      required:
        - token
        - secret
      type: object
    CreateCategoryInputBody:
      additionalProperties: false
      properties:
        budget_group_id:
          type: string
        color_key:
          maxLength: 40
          type: string
        icon:
          maxLength: 40
          type: string
        kind:
          description: Required for a main category.
          enum:
            - income
            - expense
            - financial
            - transfer
          type: string
        name:
          description: Stored for both locales.
          maxLength: 80
          minLength: 1
          type: string
        parent_id:
          description: Creates a subcategory, which takes the parent's kind, colour and group.
          type: string
      required:
        - name
      type: object
    CreateInputBody:
      additionalProperties: false
      properties:
        account_number:
          description: Bank number or IBAN; imports of that account then land here.
          maxLength: 50
          type: string
        bank_id:
          description: Bank register id; detected from the account number when omitted.
          maxLength: 40
          type: string
        currency:
          pattern: ^[A-Z]{3}$
          type: string
        kind:
          enum:
            - current
            - savings
            - pocket
            - fund
            - broker
            - cash
            - card
            - p2p
            - pension
            - property
            - other_asset
            - mortgage
            - loan
          type: string
        name:
          maxLength: 100
          minLength: 1
          type: string
        opening_balance_minor:
          format: int64
          type: integer
      required:
        - name
        - kind
        - currency
      type: object
    CreateRuleInputBody:
      additionalProperties: false
      properties:
        category_id:
          type: string
        match_counterparty:
          maxLength: 200
          minLength: 1
          type: string
        match_counterparty_account:
          maxLength: 50
          minLength: 1
          type: string
        match_description:
          maxLength: 200
          minLength: 1
          type: string
        match_operation_type:
          maxLength: 60
          minLength: 1
          type: string
        match_variable_symbol:
          maxLength: 10
          minLength: 1
          type: string
        priority:
          default: 100
          format: int64
          maximum: 1000
          minimum: 0
          type: integer
      required:
        - category_id
      type: object
    CredentialsInputBody:
      additionalProperties: false
      properties:
        email:
          format: email
          maxLength: 254
          type: string
        password:
          maxLength: 256
          type: string
      required:
        - email
        - password
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    FlowLink:
      additionalProperties: false
      properties:
        amount_minor:
          description: Always positive.
          format: int64
          type: integer
        source:
          description: Node key.
          type: string
        target:
          description: Node key.
          type: string
      required:
        - source
        - target
        - amount_minor
      type: object
    FlowNode:
      additionalProperties: false
      properties:
        account_id:
          type: string
        category_id:
          type: string
        key:
          description: Stable id to reference from links.
          type: string
        kind:
          description: "income/expense/financial: a main category (category_id absent = not yet categorised); account: an own account; saving: a saving account money went into."
          enum:
            - income
            - account
            - expense
            - financial
            - saving
          type: string
      required:
        - key
        - kind
      type: object
    FlowsReport:
      additionalProperties: false
      properties:
        currency:
          type: string
        links:
          description: Largest first. Income categories flow into accounts; accounts flow into spending categories and saving accounts.
          items:
            $ref: "#/components/schemas/FlowLink"
          type: array
        month:
          type: string
        nodes:
          items:
            $ref: "#/components/schemas/FlowNode"
          type: array
      required:
        - month
        - currency
        - nodes
        - links
      type: object
    HistoryOutputBody:
      additionalProperties: false
      properties:
        months:
          description: Oldest first.
          items:
            $ref: "#/components/schemas/NetWorthMonth"
          type: array
      required:
        - months
      type: object
    HoldingSummary:
      additionalProperties: false
      properties:
        dividends_net_czk:
          $ref: "#/components/schemas/Amount"
        first_bought_on:
          format: date
          type: string
        invested_czk:
          $ref: "#/components/schemas/Amount"
          description: All purchases with fees.
        realized_cost_czk:
          $ref: "#/components/schemas/Amount"
          description: What the sold lots cost; the gain's base for a percentage.
        realized_gain_czk:
          $ref: "#/components/schemas/Amount"
        sold_quantity:
          type: string
      required:
        - invested_czk
        - sold_quantity
        - realized_gain_czk
        - realized_cost_czk
        - dividends_net_czk
      type: object
    ImportAccount:
      additionalProperties: false
      properties:
        account_id:
          type: string
        checks:
          items:
            $ref: "#/components/schemas/ImportCheck"
          type: array
        currency:
          type: string
        duplicates:
          format: int64
          type: integer
        identity:
          description: Bank account number or importer reference; empty when the file names none.
          type: string
        is_new:
          description: The import will create this account.
          type: boolean
        key:
          description: Use as the key in the mapping form field.
          type: string
        matched_by:
          description: How the target account was chosen.
          enum:
            - identity
            - alias
            - user
            - none
          type: string
        name:
          type: string
        needs_mapping:
          description: The file names no account; the user must choose one before commit.
          type: boolean
        new:
          format: int64
          type: integer
        new_account:
          $ref: "#/components/schemas/NewAccount"
          description: The account the import would create, when is_new.
        rows:
          format: int64
          type: integer
      required:
        - key
        - matched_by
        - needs_mapping
        - identity
        - name
        - currency
        - is_new
        - rows
        - new
        - duplicates
        - checks
      type: object
    ImportBatch:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        file_name:
          type: string
        forced:
          type: boolean
        format:
          type: string
        id:
          type: string
        period_from:
          format: date
          type: string
        period_to:
          format: date
          type: string
        rolled_back_at:
          format: date-time
          type: string
        rows_duplicate:
          format: int64
          type: integer
        rows_inserted:
          format: int64
          type: integer
        rows_total:
          format: int64
          type: integer
        status:
          enum:
            - committed
            - rolled_back
          type: string
      required:
        - id
        - file_name
        - format
        - status
        - forced
        - rows_total
        - rows_inserted
        - rows_duplicate
        - created_at
      type: object
    ImportCheck:
      additionalProperties: false
      properties:
        actual_minor:
          format: int64
          type: integer
        expected_minor:
          format: int64
          type: integer
        kind:
          enum:
            - totals
            - balance_chain
            - declared_sum
          type: string
        line:
          format: int64
          type: integer
        ok:
          type: boolean
      required:
        - kind
        - ok
        - expected_minor
        - actual_minor
      type: object
    ImportPreviewRow:
      additionalProperties: false
      properties:
        account_key:
          type: string
        amount:
          $ref: "#/components/schemas/Amount"
        booked_on:
          format: date
          type: string
        description:
          type: string
        line:
          format: int64
          type: integer
        status:
          enum:
            - new
            - duplicate
            - in_other_statement
          type: string
      required:
        - account_key
        - line
        - booked_on
        - amount
        - description
        - status
      type: object
    ImportResult:
      additionalProperties: false
      properties:
        accounts:
          items:
            $ref: "#/components/schemas/ImportAccount"
          type: array
        already_imported:
          type: boolean
        batch_id:
          description: Set once the import is written.
          type: string
        categorized_by_bank:
          format: int64
          type: integer
        categorized_by_file:
          description: Rows whose category column named a known category.
          format: int64
          type: integer
