components:
  schemas:
    Account:
      additionalProperties: false
      properties:
        account_number:
          type: string
        archived:
          type: boolean
        balance:
          $ref: "#/components/schemas/Amount"
          description: Opening balance plus every imported movement.
        color_key:
          type: string
        currency:
          type: string
        id:
          type: string
        institution:
          enum:
            - mbank_cz
            - mbank_sk
            - revolut
            - ibkr
            - other
          type: string
        kind:
          enum:
            - current
            - savings
            - pocket
            - fund
            - broker
          type: string
        last_booked_on:
          format: date
          type: string
        name:
          type: string
        opening_balance:
          $ref: "#/components/schemas/Amount"
        transaction_count:
          format: int64
          type: integer
      required:
        - id
        - name
        - institution
        - kind
        - currency
        - opening_balance
        - balance
        - transaction_count
        - archived
      type: object
    AgentToken:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        expires_at:
          format: date-time
          type: string
        id:
          type: string
        last4:
          type: string
        last_used_at:
          format: date-time
          type: string
        name:
          type: string
        revoked_at:
          format: date-time
          type: string
        scopes:
          items:
            type: string
          type: array
      required:
        - id
        - name
        - last4
        - scopes
        - created_at
      type: object
    AmbiguousTransfer:
      additionalProperties: false
      properties:
        candidate_ids:
          description: Incoming movements that could be its other leg.
          items:
            type: string
          type: array
        transaction_id:
          description: The outgoing leg.
          type: string
      required:
        - transaction_id
        - candidate_ids
      type: object
    Amount:
      additionalProperties: false
      properties:
        currency:
          description: ISO 4217 code.
          maxLength: 3
          minLength: 3
          type: string
        minor:
          description: Amount in the currency's smallest unit (haléře, cents).
          format: int64
          type: integer
      required:
        - minor
        - currency
      type: object
    Assignment:
      additionalProperties: false
      properties:
        amount_minor:
          format: int64
          type: integer
        category_id:
          type: string
        source:
          enum:
            - rule
            - manual
            - bank
          type: string
      required:
        - category_id
        - amount_minor
        - source
      type: object
    AuditEntry:
      additionalProperties: false
      properties:
        id:
          format: int64
          type: integer
        occurred_at:
          format: date-time
          type: string
        operation:
          type: string
        result_count:
          format: int64
          type: integer
        status:
          format: int64
          type: integer
        token_id:
          type: string
        token_name:
          type: string
      required:
        - id
        - token_id
        - token_name
        - operation
        - status
        - occurred_at
      type: object
    BudgetGroup:
      additionalProperties: false
      properties:
        code:
          type: string
        id:
          type: string
        name_cs:
          type: string
        name_sk:
          type: string
        sort:
          format: int64
          type: integer
      required:
        - id
        - code
        - name_cs
        - name_sk
        - sort
      type: object
    BudgetLine:
      additionalProperties: false
      properties:
        budget_group_id:
          type: string
        category_id:
          type: string
        planned_minor:
          format: int64
          type: integer
        projected_minor:
          description: Spending by month end at the current pace.
          format: int64
          type: integer
        remaining_minor:
          format: int64
          type: integer
        spent_minor:
          format: int64
          type: integer
        status:
          enum:
            - on_track
            - ahead_of_pace
            - over
          type: string
      required:
        - planned_minor
        - spent_minor
        - remaining_minor
        - projected_minor
        - status
      type: object
    BudgetLineInput:
      additionalProperties: false
      properties:
        budget_group_id:
          type: string
        category_id:
          type: string
        planned_minor:
          format: int64
          minimum: 0
          type: integer
      required:
        - planned_minor
      type: object
    BudgetMonth:
      additionalProperties: false
      properties:
        currency:
          type: string
        days_left:
          description: Including today.
          format: int64
          type: integer
        elapsed:
          description: Share of the month gone, 0–1; where the pace marker sits.
          format: double
          type: number
        lines:
          items:
            $ref: "#/components/schemas/BudgetLine"
          type: array
        month:
          examples:
            - 2026-10
          type: string
        per_day_minor:
          format: int64
          type: integer
        planned_minor:
          format: int64
          type: integer
        remaining_minor:
          description: What is left to spend this month (F-VYU-3).
          format: int64
          type: integer
        spent_minor:
          format: int64
          type: integer
        unbudgeted:
          description: Main categories with spending but no budget line.
          items:
            $ref: "#/components/schemas/UnbudgetedCategory"
          type: array
      required:
        - month
        - currency
        - lines
        - unbudgeted
        - planned_minor
        - spent_minor
        - remaining_minor
        - elapsed
        - days_left
        - per_day_minor
      type: object
    CategorizeInputBody:
      additionalProperties: false
      properties:
        lines:
          description: One line, or several for a split; they must add up to the amount.
          items:
            $ref: "#/components/schemas/CategoryLine"
          maxItems: 20
          minItems: 1
          type: array
        save_rule:
          description: Turn a single-line choice into a rule matching on this field.
          enum:
            - counterparty
            - description
            - counterparty_account
          type: string
      required:
        - lines
      type: object
    CategorizeOutputBody:
      additionalProperties: false
      properties:
        applied_to_other:
          description: Other transactions the new rule categorised.
          format: int64
          type: integer
        rule_id:
          type: string
        transaction:
          $ref: "#/components/schemas/Transaction"
      required:
        - transaction
        - applied_to_other
      type: object
    Category:
      additionalProperties: false
      properties:
        budget_group_id:
          type: string
        code:
          type: string
        color_key:
          description: Theme token key; absent on a subcategory, which uses its parent's.
          type: string
        icon:
          type: string
        id:
          type: string
        kind:
          enum:
            - income
            - expense
            - financial
            - transfer
          type: string
        name_cs:
          type: string
        name_sk:
          type: string
        parent_id:
          type: string
        sort:
          format: int64
          type: integer
      required:
        - id
        - code
        - name_cs
        - name_sk
        - kind
        - sort
      type: object
    CategoryLine:
      additionalProperties: false
      properties:
        amount_minor:
          format: int64
          type: integer
        category_id:
          type: string
      required:
        - category_id
        - amount_minor
      type: object
    CategoryTotal:
      additionalProperties: false
      properties:
        amount_minor:
          format: int64
          type: integer
        category_id:
          description: Absent for the not-yet-categorised share.
          type: string
      required:
        - amount_minor
      type: object
    CopyBudgetOutputBody:
      additionalProperties: false
      properties:
        copied:
          format: int64
          type: integer
      required:
        - copied
      type: object
    CreateAgentTokenInputBody:
      additionalProperties: false
      properties:
        expires_in_days:
          description: Omit for a token that does not expire.
          format: int64
          maximum: 365
          minimum: 1
          type: integer
        name:
          maxLength: 80
          minLength: 1
          type: string
        scopes:
          items:
            enum:
              - accounts:read
              - transactions:read
              - categories:read
              - budgets:read
              - reports:read
            type: string
          minItems: 1
          type: array
      required:
        - name
        - scopes
      type: object
    CreateAgentTokenOutputBody:
      additionalProperties: false
      properties:
        secret:
          description: The token itself. Shown only in this response.
          type: string
        token:
          $ref: "#/components/schemas/AgentToken"
      required:
        - token
        - secret
      type: object
    CreateRuleInputBody:
      additionalProperties: false
      properties:
        category_id:
          type: string
        match_counterparty:
          maxLength: 200
          minLength: 1
          type: string
        match_counterparty_account:
          maxLength: 50
          minLength: 1
          type: string
        match_description:
          maxLength: 200
          minLength: 1
          type: string
        match_operation_type:
          maxLength: 60
          minLength: 1
          type: string
        match_variable_symbol:
          maxLength: 10
          minLength: 1
          type: string
        priority:
          default: 100
          format: int64
          maximum: 1000
          minimum: 0
          type: integer
      required:
        - category_id
      type: object
    CredentialsInputBody:
      additionalProperties: false
      properties:
        email:
          format: email
          maxLength: 254
          type: string
        password:
          maxLength: 256
          type: string
      required:
        - email
        - password
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ImportAccount:
      additionalProperties: false
      properties:
        account_id:
          type: string
        checks:
          items:
            $ref: "#/components/schemas/ImportCheck"
          type: array
        currency:
          type: string
        duplicates:
          format: int64
          type: integer
        identity:
          description: Bank account number or importer reference.
          type: string
        is_new:
          description: The import will create this account.
          type: boolean
        name:
          type: string
        new:
          format: int64
          type: integer
        rows:
          format: int64
          type: integer
      required:
        - identity
        - name
        - currency
        - is_new
        - rows
        - new
        - duplicates
        - checks
      type: object
    ImportBatch:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        file_name:
          type: string
        forced:
          type: boolean
        format:
          type: string
        id:
          type: string
        period_from:
          format: date
          type: string
        period_to:
          format: date
          type: string
        rolled_back_at:
          format: date-time
          type: string
        rows_duplicate:
          format: int64
          type: integer
        rows_inserted:
          format: int64
          type: integer
        rows_total:
          format: int64
          type: integer
        status:
          enum:
            - committed
            - rolled_back
          type: string
      required:
        - id
        - file_name
        - format
        - status
        - forced
        - rows_total
        - rows_inserted
        - rows_duplicate
        - created_at
      type: object
    ImportCheck:
      additionalProperties: false
      properties:
        actual_minor:
          format: int64
          type: integer
        expected_minor:
          format: int64
          type: integer
        kind:
          enum:
            - totals
            - balance_chain
            - declared_sum
          type: string
        line:
          format: int64
          type: integer
        ok:
          type: boolean
      required:
        - kind
        - ok
        - expected_minor
        - actual_minor
      type: object
    ImportPreviewRow:
      additionalProperties: false
      properties:
        account_identity:
          type: string
        amount:
          $ref: "#/components/schemas/Amount"
        booked_on:
          format: date
          type: string
        description:
          type: string
        line:
          format: int64
          type: integer
        status:
          enum:
            - new
            - duplicate
          type: string
      required:
        - account_identity
        - line
        - booked_on
        - amount
        - description
        - status
      type: object
    ImportResult:
      additionalProperties: false
      properties:
        accounts:
          items:
            $ref: "#/components/schemas/ImportAccount"
          type: array
        already_imported:
          type: boolean
        batch_id:
          description: Set once the import is written.
          type: string
        categorized_by_bank:
          format: int64
          type: integer
        categorized_by_rule:
          format: int64
          type: integer
        checks_passed:
          type: boolean
        file_name:
          type: string
        format:
          type: string
        period_from:
          format: date
          type: string
        period_to:
          format: date
          type: string
        rows:
          description: The first 500 rows with their status.
          items:
            $ref: "#/components/schemas/ImportPreviewRow"
          type: array
        rows_duplicate:
          format: int64
          type: integer
        rows_new:
          format: int64
          type: integer
        rows_total:
          format: int64
          type: integer
        transfers_matched:
          format: int64
          type: integer
      required:
        - file_name
        - format
        - already_imported
        - checks_passed
        - accounts
        - rows
        - rows_total
        - rows_new
        - rows_duplicate
        - categorized_by_rule
        - categorized_by_bank
        - transfers_matched
      type: object
    ListAccountsOutputBody:
      additionalProperties: false
      properties:
        accounts:
          items:
            $ref: "#/components/schemas/Account"
          type: array
      required:
        - accounts
      type: object
    ListAgentTokensOutputBody:
      additionalProperties: false
      properties:
        tokens:
          items:
            $ref: "#/components/schemas/AgentToken"
          type: array
      required:
        - tokens
      type: object
    ListAmbiguousOutputBody:
      additionalProperties: false
      properties:
        ambiguous:
          items:
            $ref: "#/components/schemas/AmbiguousTransfer"
          type: array
      required:
        - ambiguous
      type: object
    ListAuditOutputBody:
      additionalProperties: false
      properties:
        entries:
          items:
            $ref: "#/components/schemas/AuditEntry"
          type: array
      required:
        - entries
      type: object
    ListImportsOutputBody:
      additionalProperties: false
      properties:
        imports:
          items:
            $ref: "#/components/schemas/ImportBatch"
          type: array
      required:
        - imports
      type: object
    ListTransactionsOutputBody:
      additionalProperties: false
      properties:
        next_cursor:
          type: string
        transactions:
          items:
            $ref: "#/components/schemas/Transaction"
          type: array
      required:
        - transactions
      type: object
    ListTransfersOutputBody:
      additionalProperties: false
      properties:
        transfers:
          items:
            $ref: "#/components/schemas/TransferPair"
          type: array
      required:
        - transfers
      type: object
    MeOutputBody:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        email:
          type: string
      required:
        - email
        - created_at
      type: object
    MonthTotals:
      additionalProperties: false
      properties:
        expense_minor:
          description: "Positive: money spent."
          format: int64
          type: integer
        financial_minor:
          description: "Saving and loan repayments: set aside, not spent (F-KAT-2)."
          format: int64
          type: integer
        income_minor:
          format: int64
          type: integer
        month:
          type: string
      required:
        - month
        - income_minor
        - expense_minor
        - financial_minor
      type: object
    MonthlyReport:
      additionalProperties: false
      properties:
        currency:
          type: string
        expense_minor:
          description: "Positive: money spent."
          format: int64
          type: integer
        expenses:
          description: Per main category, largest first.
          items:
            $ref: "#/components/schemas/CategoryTotal"
          type: array
        financial_minor:
          description: "Saving and loan repayments: set aside, not spent (F-KAT-2)."
          format: int64
          type: integer
        income:
          items:
            $ref: "#/components/schemas/CategoryTotal"
          type: array
        income_minor:
          format: int64
          type: integer
        month:
          type: string
        trend:
          description: The last six months, oldest first.
          items:
            $ref: "#/components/schemas/MonthTotals"
          type: array
      required:
        - currency
        - expenses
        - income
        - trend
        - month
        - income_minor
        - expense_minor
        - financial_minor
      type: object
    PairTransferInputBody:
      additionalProperties: false
      properties:
        in_tx_id:
          maxLength: 64
          type: string
        out_tx_id:
          maxLength: 64
          type: string
      required:
        - out_tx_id
        - in_tx_id
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          description: Stable machine-readable error identifier. Branch on this, not on `detail`.
          enum:
            - already_imported
            - already_rolled_back
            - already_set_up
            - auth_required
            - balance_mismatch
            - duplicate_budget_line
            - file_too_large
            - forbidden
            - host_not_allowed
            - insufficient_scope
            - internal_error
            - invalid_budget_line
            - invalid_credentials
            - invalid_currency
            - invalid_cursor
            - invalid_request_body
            - method_not_allowed
            - not_found
            - not_pairable
            - not_paired
            - nothing_to_match
            - password_too_short
            - rate_limited
            - session_required
            - split_mismatch
            - token_ttl_too_long
            - unknown_scope
            - unsupported_format
            - validation_failed
          title: ErrorCode
          type: string
        detail:
          description: English explanation; localize from code instead of showing this.
          type: string
        errors:
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type: array
        instance:
          description: Request id of this occurrence.
          type: string
        status:
          format: int64
          type: integer
        title:
          type: string
      required:
        - title
        - status
        - code
      type: object
    ReplaceBudgetInputBody:
      additionalProperties: false
      properties:
        lines:
          items:
            $ref: "#/components/schemas/BudgetLineInput"
          maxItems: 200
          type: array
      required:
        - lines
      type: object
    RollbackOutputBody:
      additionalProperties: false
      properties:
        removed:
          format: int64
          type: integer
      required:
        - removed
      type: object
    Rule:
      additionalProperties: false
      properties:
        category_id:
          type: string
        created_at:
          format: date-time
          type: string
        id:
          type: string
        match_counterparty:
          description: Equal to the counterparty, ignoring case.
          type: string
        match_counterparty_account:
          type: string
        match_description:
          description: Contained in the description, ignoring case.
          type: string
        match_operation_type:
          type: string
        match_variable_symbol:
          type: string
        priority:
          format: int64
          type: integer
      required:
        - id
        - category_id
        - priority
        - created_at
      type: object
    RulesOutputBody:
      additionalProperties: false
      properties:
        rules:
          items:
            $ref: "#/components/schemas/Rule"
          type: array
      required:
        - rules
      type: object
    SessionBody:
      additionalProperties: false
      properties:
        access_token:
          type: string
        email:
          type: string
        expires_in:
          description: Seconds until the access token expires.
          format: int64
          type: integer
      required:
        - access_token
        - expires_in
        - email
      type: object
    StatusOutputBody:
      additionalProperties: false
      properties:
        needs_setup:
          description: True until the single user has been created.
          type: boolean
      required:
        - needs_setup
      type: object
    Suggestion:
      additionalProperties: false
      properties:
        category_id:
          type: string
        uses:
          format: int64
          type: integer
      required:
        - category_id
        - uses
      type: object
    TaxonomyOutputBody:
      additionalProperties: false
      properties:
        budget_groups:
          items:
            $ref: "#/components/schemas/BudgetGroup"
          type: array
        categories:
          items:
            $ref: "#/components/schemas/Category"
          type: array
      required:
        - categories
        - budget_groups
      type: object
    Transaction:
      additionalProperties: false
      properties:
        account_id:
          type: string
        amount:
          $ref: "#/components/schemas/Amount"
        balance_after_minor:
          format: int64
          type: integer
        bank_category:
          type: string
        booked_on:
          format: date
          type: string
        categories:
          items:
            $ref: "#/components/schemas/Assignment"
          type: array
        constant_symbol:
          type: string
        counterparty:
          type: string
        counterparty_account:
          type: string
        description:
          type: string
        fee_minor:
          format: int64
          type: integer
        id:
          type: string
        import_batch_id:
          type: string
        message:
          type: string
        operation_type:
          type: string
        source_line:
          description: Line in the imported file (F-IMP-6).
          format: int64
          type: integer
        specific_symbol:
          type: string
        transfer:
          $ref: "#/components/schemas/Transfer"
          description: Set when this is one leg of a transfer between own accounts.
        variable_symbol:
          type: string
      required:
        - id
        - account_id
        - booked_on
        - amount
        - fee_minor
        - description
        - import_batch_id
        - source_line
        - categories
      type: object
    Transfer:
      additionalProperties: false
      properties:
        counterpart_account_id:
          type: string
        counterpart_tx_id:
          type: string
        matched_by:
          enum:
            - auto
            - manual
          type: string
      required:
        - counterpart_tx_id
        - counterpart_account_id
        - matched_by
      type: object
    TransferPair:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        in_tx_id:
          type: string
        matched_by:
          enum:
            - auto
            - manual
          type: string
        out_tx_id:
          type: string
      required:
        - out_tx_id
        - in_tx_id
        - matched_by
        - created_at
      type: object
    TriageOutputBody:
      additionalProperties: false
      properties:
        quick_picks:
          description: Most used categories lately, for the 1–9 keys.
          items:
            $ref: "#/components/schemas/Suggestion"
          type: array
        remaining:
          format: int64
          type: integer
        suggested:
          description: Categories used before for the same counterparty.
          items:
            $ref: "#/components/schemas/Suggestion"
          type: array
        transaction:
          $ref: "#/components/schemas/Transaction"
          description: Absent when nothing is left to categorise.
      required:
        - remaining
        - suggested
        - quick_picks
      type: object
    UnbudgetedCategory:
      additionalProperties: false
      properties:
        category_id:
          type: string
        spent_minor:
          format: int64
          type: integer
      required:
        - category_id
        - spent_minor
      type: object
    UpdateAccountInputBody:
      additionalProperties: false
      properties:
        archived:
          type: boolean
        color_key:
          maxLength: 40
          type: string
        kind:
          enum:
            - current
            - savings
            - pocket
            - fund
            - broker
          type: string
        name:
          maxLength: 100
          minLength: 1
          type: string
        opening_balance_minor:
          format: int64
          type: integer
      type: object
    UpdateCategoryInputBody:
      additionalProperties: false
      properties:
        budget_group_id:
          type: string
        color_key:
          maxLength: 40
          type: string
        icon:
          maxLength: 40
          type: string
        name_cs:
          maxLength: 80
          minLength: 1
          type: string
        name_sk:
          maxLength: 80
          minLength: 1
          type: string
      type: object
    VersionOutputBody:
      additionalProperties: false
      properties:
        commit:
          type: string
        go_version:
          type: string
        version:
          type: string
      required:
        - version
        - commit
        - go_version
      type: object
  securitySchemes:
    bearerAuth:
      description: Either the session access token from `POST /api/v1/auth/login` (a short-lived JWT, refreshed with the HttpOnly refresh cookie) or an agent token `coinbook_pat_…` from `POST /api/v1/agent-tokens`. Agent tokens are read-only and limited to their scopes; every request made with one is written to the audit log.
      scheme: bearer
      type: http
