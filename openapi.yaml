  securitySchemes:
    bearerAuth:
      description: Either the session access token from `POST /api/v1/auth/login` (a short-lived JWT, refreshed with the HttpOnly refresh cookie) or an agent token `coinbook_pat_…` from `POST /api/v1/agent-tokens`. Agent tokens are read-only and limited to their scopes; every request made with one is written to the audit log.
      scheme: bearer
      type: http
info:
  description: |-
    Personal finance: accounts, imported transactions, categories, transfers, budgets, reports, investments, loans and net worth.

    Amounts are integers in the currency's smallest unit (`minor`) with an ISO 4217 `currency`; currencies are never summed together. Dates are calendar days in Europe/Prague.

    Errors are `application/problem+json` (RFC 9457) with a stable `code`; branch on `code`, not `detail`.
  title: coin-book API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/account-aliases:
    get:
      operationId: list-account-aliases
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAliasesOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - bearerAuth: []
      summary: Remembered mappings of bank accounts onto own accounts
      tags:
        - Accounts
  /api/v1/account-aliases/{id}:
    delete:
      operationId: delete-account-alias
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
